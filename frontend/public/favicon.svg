<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aerisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#F0801E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cockpit Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#08080C" stroke="#1E202B" stroke-width="1.5" />

  <!-- Subtle Navigation Radar Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(45, 212, 191, 0.15)" stroke-width="1" stroke-dasharray="3,3" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1" />

  <!-- AERIS Tactical Delta Chevron Arrow -->
  <g filter="url(#glow)">
    <path d="M 32 12 L 48 48 L 32 40 L 16 48 Z" fill="url(#aerisGrad)" stroke="#050508" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Inner High-Visibility Cockpit Dot -->
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="1.5" fill="#08080C" />
</svg>