# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Use Android Studio's bundled JBR (JDK 21) instead of system JDK 26.
# JDK 26 removed support for --disable-plugin system-modules in jlink,
# which breaks the Android Gradle Plugin's JdkImageTransform step.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Specifies JVM arguments for the Kotlin compiler daemon process to prevent OOM crashes.
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process

# Enable parallel execution, build cache, and Kotlin incremental compilation
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true

# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with your app's APK.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only
# the resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Mapbox SDK download token.
# Generate a secret token at https://account.mapbox.com/access-tokens/
# with the DOWNLOADS:READ scope and paste it here.
MAPBOX_DOWNLOADS_TOKEN=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
